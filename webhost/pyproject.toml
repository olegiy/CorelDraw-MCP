[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coreldraw-agent"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==1.30.0",
  "fastapi==0.162.0",
  "sse-starlette==3.5.1",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "keyring==25.7.0",
  "uvicorn==0.38.0",
  "pillow==12.0.0",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.6"]

[tool.setuptools.packages.find]
include = ["corel_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: opt-in CorelDRAW test using temporary documents only"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
